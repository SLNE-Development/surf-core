name: Publish to Maven & Create GitHub Release

on:
  push:
    branches:
      - 'version/*'
  workflow_dispatch:

jobs:
  build:
    uses: SLNE-Development/surf-workflows/.github/workflows/build-publish-release-gradle.yml@master
    with:
      modules: "surf-core-paper-*-all.jar;surf-core-velocity-*-all.jar;surf-core-microservice-*-all.jar;surf-core-launcher-server-*-all.jar"
    secrets: inherit
